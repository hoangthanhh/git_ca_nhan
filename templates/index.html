<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1e3a8a;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 16px;
        }

        .form-box {
            background: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-box h2 {
            color: #334155;
            margin-bottom: 20px;
            font-size: 21px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #334155;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 10px;
        }

        .result h2 {
            color: #334155;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            background: #eff6ff;
        }

        .stat-card h3 {
            color: #475569;
            margin-bottom: 8px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .chart {
            text-align: center;
        }

        .chart h2 {
            margin-bottom: 20px;
        }

        .chart img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .stats {
                flex-direction: column;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 Quản lý sinh viên</h1>
        <p>Thống kê số lượng sinh viên trong lớp</p>
    </div>

    <div class="form-box">

        <h2>Nhập thông tin sinh viên</h2>

        <form method="POST">

            <div class="input-group">
                <label for="male">Số sinh viên nam</label>
                <input
                    type="number"
                    id="male"
                    name="male"
                    min="0"
                    placeholder="Nhập số sinh viên nam"
                    required>
            </div>

            <div class="input-group">
                <label for="female">Số sinh viên nữ</label>
                <input
                    type="number"
                    id="female"
                    name="female"
                    min="0"
                    placeholder="Nhập số sinh viên nữ"
                    required>
            </div>

            <button class="btn" type="submit">
                📊 Hiển thị thống kê
            </button>

        </form>

    </div>


    {% if male is not none and female is not none %}

    <div class="result">

        <h2>📈 Kết quả thống kê</h2>

        <div class="stats">

            <div class="stat-card">
                <h3>👨 Sinh viên nam</h3>
                <p>{{ male }}</p>
            </div>

            <div class="stat-card">
                <h3>👩 Sinh viên nữ</h3>
                <p>{{ female }}</p>
            </div>

        </div>


        <div class="chart">

            <h2>Biểu đồ số lượng sinh viên</h2>

            <img
                src="{{ url_for('static', filename='chart.png') }}"
                alt="Biểu đồ sinh viên">

        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
